name: proxy-refresh

# Free proxy pipeline: fetch public lists -> test -> commit -> notify
# subscribers (with day limits) -> purge CDN. Runs every 2 hours and on
# demand. Each run commits, so the schedule never goes idle (GitHub pauses
# schedules after 60 days of no activity).

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxy-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch proxy lists
        run: python fetch_proxies.py proxies

      - name: Test proxies
        run: python test_proxies.py proxies
        env:
          TEST_PORTAL: "1"
          REFRESH_HOURS: "2"

      - name: Commit results
        id: commit
        run: |
          git config user.name "proxy-bot"
          git config user.email "proxy-bot@users.noreply.github.com"
          git add proxies/http_raw.txt proxies/http_tested.txt proxies/portal_ok.txt proxies/sample.txt proxies/sources.json proxies/stats.json subscribers.json
          git diff --cached --quiet && echo "no changes" && echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT" && exit 0
          git commit -m "proxy refresh $(date -u +%F_%T)"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Purge CDN cache
        if: always()
        run: |
          for f in proxies/http_tested.txt proxies/portal_ok.txt proxies/stats.json proxies/http_raw.txt; do
            curl -s --max-time 30 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" -o /dev/null
          done
          echo "jsdelivr cache purged"

      - name: Notify Telegram
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DATA_SHA: ${{ steps.commit.outputs.sha }}
        run: python notify.py
